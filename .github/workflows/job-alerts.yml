name: Weekly job alerts

# frontend/ deploys to Railway, so Vercel Cron is not available. GitHub Actions is free,
# version-controlled, portable if the host changes, and re-runnable by hand from the
# Actions tab.
#
# CRON_SECRET must match the value on the Railway frontend service.
# SITE_URL can override the production URL.

on:
  schedule:
    # 14:00 UTC on Tuesdays. GitHub's scheduler can drift 5-15 minutes under load,
    # which does not matter for a weekly digest.
    - cron: '0 14 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute the digest without sending anything'
        type: boolean
        default: false
      force:
        description: 'Bypass the send-day guard'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    concurrency: weekly-job-alerts
    steps:
      - name: Trigger job alert digest
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Set the CRON_SECRET repository secret."
            exit 1
          fi

          SITE_URL="${SITE_URL:-https://therobotage.com}"
          if [[ ! "$SITE_URL" =~ ^https://[a-zA-Z0-9.-]+/?$ ]]; then
            echo "::error::SITE_URL must be an HTTPS site origin."
            exit 1
          fi

          query=""
          [ "${DRY_RUN:-false}" = "true" ] && query="?dryRun=1"
          if [ "${FORCE:-false}" = "true" ]; then
            if [ -n "$query" ]; then query="${query}&force=1"; else query="?force=1"; fi
          fi

          response=$(curl -fsS --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/job-alerts${query}")

          jq '{ok, skipped, dryRun, jobsInWindow, subscribers, digestsSent, failureCount: (.failures | length)}' <<< "$response"
          jq -e '.ok == true and (if has("failures") then .failures == [] else .skipped == "not send day" or .jobsInWindow == 0 end)' <<< "$response" > /dev/null || {
            echo "Digest reported failures"
            exit 1
          }
