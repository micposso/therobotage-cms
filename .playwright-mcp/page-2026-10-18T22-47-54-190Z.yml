    - region [ref=f1e34]:
      - generic [ref=f1e35]:
        - generic [ref=f1e36]:
          - generic [ref=f1e37]:
            - paragraph [ref=f1e38]: LA BRECHA DEL DESPLIEGUE
            - heading "Instalar un robot es solo el principio." [level=2] [ref=f1e39]
          - generic [ref=f1e40]:
            - paragraph [ref=f1e41]: Su equipo sabe construir, configurar y desplegar robots. Pero cada nuevo cliente trae consigo nuevos trabajadores, idiomas, procesos y retos operativos.
            - paragraph [ref=f1e42]: A medida que crecen los despliegues, la formación de clientes se convierte en una responsabilidad operativa continua.
        - list [ref=f1e43]:
          - listitem [ref=f1e44]:
            - generic [ref=f1e45]: "01"
            - heading "La formación no crece por sí sola" [level=3] [ref=f1e46]
            - paragraph [ref=f1e47]: Cada centro de trabajo requiere incorporación y formación práctica para sus equipos.
          - listitem [ref=f1e48]:
            - generic [ref=f1e49]: "02"
            - heading "Los equipos de trabajo son diversos" [level=3] [ref=f1e50]
            - paragraph [ref=f1e51]: Los empleados pueden tener distintos idiomas, expectativas culturales, responsabilidades y niveles de familiaridad con los robots.
          - listitem [ref=f1e52]:
            - generic [ref=f1e53]: "03"
            - heading "La adopción continúa tras la puesta en marcha" [level=3] [ref=f1e54]
            - paragraph [ref=f1e55]: Las nuevas incorporaciones, los cambios de procesos, las actualizaciones de software y la ampliación de flotas requieren formación continua.
        - paragraph [ref=f1e56]: Ustedes se centran en sus robots. Nosotros ayudamos a sus clientes a aprender a trabajar con ellos.
        - paragraph [ref=f1e57]: Preparamos a los equipos de trabajo. No vendemos ni instalamos robots. Nuestros programas complementan la formación técnica, la ingeniería de seguridad, el mantenimiento y los requisitos de puesta en marcha del fabricante.
    - region [ref=f1e58]:
      - generic [ref=f1e59]:
        - generic [ref=f1e60]:
          - generic [ref=f1e61]:
            - paragraph [ref=f1e62]: ACADEMIA COMO SERVICIO
            - heading "Su producto robótico. Sus clientes. Su Academia." [level=2] [ref=f1e63]
          - generic [ref=f1e64]:
            - paragraph [ref=f1e65]: La Academia de Despliegue Robótico como Servicio es una oferta gestionada de formación y adopción diseñada en torno a su producto robótico y los entornos donde opera.
            - paragraph [ref=f1e66]: Colaboramos con su organización para crear programas de aprendizaje reutilizables que se adaptan a distintos clientes, ubicaciones y equipos.
        - generic [ref=f1e67]:
          - img "Un supervisor explica los límites peatonales junto a un robot móvil de transporte de materiales detenido." [ref=f1e69]
          - list [ref=f1e70]:
            - listitem [ref=f1e71]:
              - generic [ref=f1e72]: "01"
              - generic [ref=f1e73]:
                - heading "Preparación para el despliegue" [level=3] [ref=f1e74]
                - paragraph [ref=f1e75]: Evaluamos roles, necesidades formativas y brechas de conocimiento operativo.
            - listitem [ref=f1e76]:
              - generic [ref=f1e77]: "02"
              - generic [ref=f1e78]:
                - heading "Incorporación de clientes" [level=3] [ref=f1e79]
                - paragraph [ref=f1e80]: Preparamos al personal de primera línea, a supervisores y a los equipos del cliente.
            - listitem [ref=f1e81]:
              - generic [ref=f1e82]: "03"
              - generic [ref=f1e83]:
                - heading "Aprendizaje multilingüe" [level=3] [ref=f1e84]
                - paragraph [ref=f1e85]: Desarrollamos cursos, materiales y evaluaciones adaptados a distintos idiomas y equipos.
            - listitem [ref=f1e86]:
              - generic [ref=f1e87]: "04"
              - generic [ref=f1e88]:
                - heading "Evaluación de competencias" [level=3] [ref=f1e89]
                - paragraph [ref=f1e90]: Evaluamos la comprensión y el dominio práctico de las tareas.
            - listitem [ref=f1e91]:
              - generic [ref=f1e92]: "05"
              - generic [ref=f1e93]:
                - heading "Gestión de la adopción" [level=3] [ref=f1e94]
                - paragraph [ref=f1e95]: Apoyamos la comunicación, la confianza, la gestión del cambio y la interacción humano-robot.
            - listitem [ref=f1e96]:
              - generic [ref=f1e97]: "06"
              - generic [ref=f1e98]:
                - heading "Formación continua" [level=3] [ref=f1e99]
                - paragraph [ref=f1e100]: Ofrecemos formación de actualización ante nuevas contrataciones, cambios en los robots y ampliaciones del despliegue.
    - region [ref=f1e101]:
      - generic [ref=f1e102]:
        - paragraph [ref=f1e103]: NUESTRA ESPECIALIZACIÓN
        - generic [ref=f1e104]:
          - heading "Los robots operan globalmente. Las personas los viven de forma distinta." [level=2] [ref=f1e105]
          - paragraph [ref=f1e106]: Los robots comerciales llegan a entornos definidos por distintos idiomas, culturas, estilos de comunicación y expectativas tecnológicas. Una buena adopción requiere más que traducir un manual.
        - generic [ref=f1e107]:
          - img "Empleados de hotel hablan sobre un robot de limpieza y diagramas formativos con un instructor." [ref=f1e109]
          - generic [ref=f1e110]:
            - paragraph [ref=f1e111]: The Robot Age se especializa en interacción humano-robot multicultural, formación de equipos y prácticas de adopción orientadas por la investigación.
            - paragraph [ref=f1e112]: Investigamos cómo el idioma, la cultura laboral, la comunicación, la confianza y las expectativas influyen en la comprensión de los robots y el trabajo junto a ellos. Aplicamos estos conocimientos al diseño de programas adaptados a equipos diversos.
            - paragraph [ref=f1e113]: El inglés y el español son los idiomas inicialmente previstos para impartir formación. Otros idiomas están sujetos a evaluación y al alcance del proyecto.
        - generic [ref=f1e114]:
          - article [ref=f1e115]:
            - heading "Cursos multilingües" [level=3] [ref=f1e116]
            - paragraph [ref=f1e117]: Desarrollamos experiencias de aprendizaje, materiales de incorporación y evaluaciones específicos para cada robot en los idiomas adecuados para el despliegue.
          - article [ref=f1e118]:
            - heading "Aprendizaje adaptado culturalmente" [level=3] [ref=f1e119]
            - paragraph [ref=f1e120]: Adaptamos ejemplos, terminología y métodos de comunicación al contexto operativo y cultural.
          - article [ref=f1e121]:
            - heading "Investigación con los equipos" [level=3] [ref=f1e122]
            - paragraph [ref=f1e123]: Utilizamos entrevistas, observaciones de campo y evaluaciones estructuradas para identificar barreras a la comprensión, la confianza y la adopción.
          - article [ref=f1e124]:
            - heading "Evaluación inclusiva" [level=3] [ref=f1e125]
            - paragraph [ref=f1e126]: Evaluamos resultados prácticos del aprendizaje entre roles y grupos lingüísticos para identificar oportunidades de mejora.
        - paragraph [ref=f1e127]: Un producto robótico. Muchos idiomas. Diferentes culturas. Un estándar coherente de preparación de los equipos.
    - region [ref=f1e128]:
