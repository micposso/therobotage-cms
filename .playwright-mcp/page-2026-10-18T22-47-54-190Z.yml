              - generic [ref=f1e141]: "02"
              - generic [aria-hidden] [ref=f1e142]: →
            - heading "Crear" [level=3] [ref=f1e143]
            - paragraph [ref=f1e144]: Creamos itinerarios de aprendizaje, contenidos formativos, ejercicios por rol y evaluaciones.
          - listitem [ref=f1e145]:
            - generic [ref=f1e146]:
              - generic [ref=f1e147]: "03"
              - generic [aria-hidden] [ref=f1e148]: →
            - heading "Impartir" [level=3] [ref=f1e149]
            - paragraph [ref=f1e150]: Apoyamos la incorporación mediante aprendizaje virtual, talleres presenciales, materiales digitales y formación de formadores.
          - listitem [ref=f1e151]:
            - generic [ref=f1e152]: "04"
            - heading "Medir y mejorar" [level=3] [ref=f1e154]
            - paragraph [ref=f1e155]: Revisamos resultados, recogemos opiniones y mejoramos el programa a medida que evolucionan los despliegues.
        - 'figure "El objetivo: personas y robots trabajando juntos con confianza." [ref=f1e156]':
