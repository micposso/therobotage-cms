    - region [ref=e118]:
      - generic [ref=e119]:
        - paragraph [ref=e120]: OUR SPECIALIZATION
        - generic [ref=e121]:
          - heading "Robots operate globally. People experience them differently." [level=2] [ref=e122]
          - paragraph [ref=e123]: Commercial robots enter workplaces shaped by different languages, cultures, communication styles, and expectations about technology. Successful workforce adoption requires more than translating an instruction manual.
        - generic [ref=e124]:
          - img "Hotel employees discuss a cleaning robot and training diagrams with an instructor." [ref=e126]
          - generic [ref=e127]:
            - paragraph [ref=e128]: The Robot Age specializes in research-informed multicultural human-robot interaction, workforce education, and adoption practices.
            - paragraph [ref=e129]: We investigate how language, workplace culture, communication, trust, and expectations influence how people understand and work alongside robots. We apply these insights to design training programs adapted to diverse workforces.
            - paragraph [ref=e130]: English and Spanish are our initial planned training-delivery languages. Other languages are subject to assessment and project scope.
        - generic [ref=e131]:
          - article [ref=e132]:
            - heading "Multilingual Courses" [level=3] [ref=e133]
            - paragraph [ref=e134]: Develop robot-specific learning experiences, onboarding materials, and assessments in languages appropriate to each deployment.
          - article [ref=e135]:
            - heading "Culturally Adapted Learning" [level=3] [ref=e136]
            - paragraph [ref=e137]: Adapt instructional examples, terminology, and communication methods to the operational and cultural context.
          - article [ref=e138]:
            - heading "Workforce Research" [level=3] [ref=e139]
            - paragraph [ref=e140]: Use interviews, field observations, and structured evaluations to identify barriers to understanding, trust, and adoption.
          - article [ref=e141]:
            - heading "Inclusive Assessment" [level=3] [ref=e142]
            - paragraph [ref=e143]: Evaluate practical learning outcomes across roles and language groups to identify opportunities for improvement.
        - paragraph [ref=e144]: One robotics product. Many languages. Different cultures. A consistent standard of workforce readiness.
