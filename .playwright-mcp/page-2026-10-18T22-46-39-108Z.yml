        - generic [ref=e53]:
          - generic [ref=e54]:
            - paragraph [ref=e55]: THE DEPLOYMENT GAP
            - heading "Installing a robot is only the beginning." [level=2] [ref=e56]
          - generic [ref=e57]:
            - paragraph [ref=e58]: Your team knows how to build, configure, and deploy robots. But every new customer introduces a new workforce, new languages, new workflows, and new operational challenges.
            - paragraph [ref=e59]: As deployments scale, customer education becomes a recurring operational responsibility.
        - list [ref=e60]:
          - listitem [ref=e61]:
            - generic [ref=e62]: "01"
            - heading "Training doesn't scale automatically" [level=3] [ref=e63]
            - paragraph [ref=e64]: Each customer site requires workforce onboarding and practical instruction.
          - listitem [ref=e65]:
            - generic [ref=e66]: "02"
            - heading "Workforces are not homogeneous" [level=3] [ref=e67]
            - paragraph [ref=e68]: Employees may have different languages, cultural expectations, job responsibilities, and levels of familiarity with robots.
          - listitem [ref=e69]:
            - generic [ref=e70]: "03"
            - heading "Adoption continues after go-live" [level=3] [ref=e71]
            - paragraph [ref=e72]: New hires, changing workflows, software updates, and expanding fleets create continuing education needs.
        - paragraph [ref=e73]: You focus on your robots. We help your customers learn how to work with them.
        - paragraph [ref=e74]: We prepare workforces. We do not sell or install robots. Our programs complement the manufacturer's technical training, safety engineering, servicing, and commissioning requirements.
