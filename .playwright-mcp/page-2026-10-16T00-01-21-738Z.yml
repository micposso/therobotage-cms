  - generic [ref=f1e70]:
    - generic [ref=f1e71]:
      - generic [ref=f1e72]:
        - paragraph [ref=f1e73]: Our Programs
        - heading "Understand. Experience. Design. Deploy." [level=2] [ref=f1e74]
      - generic [ref=f1e75]:
        - paragraph [ref=f1e76]: Build your robot literacy, meet real robots, or develop professional skills in robot product design and deployment. Choose the starting point that fits your goals.
        - link "Compare Professional Programs →" [ref=f1e77] [cursor=pointer]:
          - /url: /learn#programs
    - generic [ref=f1e78]:
      - article [ref=f1e79]:
        - heading "Robot Literacy" [level=3] [ref=f1e81]
        - paragraph [ref=f1e82]: Understand robots through READ, RELATE, and COEXIST. Explore what robots can and cannot do, how they affect everyday environments, and how people can communicate and share spaces with them. Build the confidence to participate in a world with robots.
        - link "Explore Robot Literacy →" [ref=f1e83] [cursor=pointer]:
          - /url: /robot-literacy
      - article [ref=f1e84]:
        - heading "Live Robot Lab" [level=3] [ref=f1e86]
        - paragraph [ref=f1e87]: Experience real robots through guided, hands-on sessions for schools and organizations. Observe how robots move, sense, and respond, ask questions, and explore human-robot interaction together. Connect classroom ideas with practical experiences that build curiosity, understanding, and confidence around robots.
        - link "Explore Live Robot Lab →" [ref=f1e88] [cursor=pointer]:
          - /url: /live-robot-lab
      - article [ref=f1e89]:
        - heading "Product Design for Robots (RPDP)" [level=3] [ref=f1e91]
        - paragraph [ref=f1e92]: Learn how to design interactions between robots, people, and their environments. Apply UX, product design, accessibility, human-robot interaction, and the Robot Experience Design framework to real robotics challenges.
        - link "Explore RPDP Curriculum →" [ref=f1e93] [cursor=pointer]:
          - /url: /learn/rpdp#curriculum
      - article [ref=f1e94]:
        - heading "Robot Deployment Practitioner (RDP)" [level=3] [ref=f1e96]
        - paragraph [ref=f1e97]: Learn how to prepare organizations for successful commercial robotics deployment. Evaluate operational readiness, workforce training, safety requirements, regulation, insurance, cultural fit, change management, adoption, and measurable business outcomes.
        - link "Explore RDP Curriculum →" [ref=f1e98] [cursor=pointer]:
          - /url: /learn/rdp#curriculum
    - paragraph [ref=f1e99]: RPDP and RDP are upcoming professional programs. Explore the Academy for dates and interest lists. Joining a list does not reserve a seat.
