    - region [ref=f2e51]:
      - generic [ref=f2e52]:
        - generic [ref=f2e53]:
          - generic [ref=f2e54]:
            - paragraph [ref=f2e55]: THE DEPLOYMENT GAP
            - heading "Installing a robot is only the beginning." [level=2] [ref=f2e56]
          - generic [ref=f2e57]:
            - paragraph [ref=f2e58]: Your team knows how to build, configure, and deploy robots. But every new customer introduces a new workforce, new languages, new workflows, and new operational challenges.
            - paragraph [ref=f2e59]: As deployments scale, customer education becomes a recurring operational responsibility.
        - list [ref=f2e60]:
          - listitem [ref=f2e61]:
            - generic [ref=f2e62]: "01"
            - heading "Training doesn't scale automatically" [level=3] [ref=f2e63]
            - paragraph [ref=f2e64]: Each customer site requires workforce onboarding and practical instruction.
          - listitem [ref=f2e65]:
            - generic [ref=f2e66]: "02"
            - heading "Workforces are not homogeneous" [level=3] [ref=f2e67]
            - paragraph [ref=f2e68]: Employees may have different languages, cultural expectations, job responsibilities, and levels of familiarity with robots.
          - listitem [ref=f2e69]:
            - generic [ref=f2e70]: "03"
            - heading "Adoption continues after go-live" [level=3] [ref=f2e71]
            - paragraph [ref=f2e72]: New hires, changing workflows, software updates, and expanding fleets create continuing education needs.
        - paragraph [ref=f2e73]: You focus on your robots. We help your customers learn how to work with them.
        - paragraph [ref=f2e74]: We prepare workforces. We do not sell or install robots. Our programs complement the manufacturer's technical training, safety engineering, servicing, and commissioning requirements.
    - region [ref=f2e75]:
