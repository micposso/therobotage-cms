    - region [ref=f2e118]:
      - generic [ref=f2e119]:
        - paragraph [ref=f2e120]: OUR SPECIALIZATION
        - generic [ref=f2e121]:
          - heading "Robots operate globally. People experience them differently." [level=2] [ref=f2e122]
          - paragraph [ref=f2e123]: Commercial robots enter workplaces shaped by different languages, cultures, communication styles, and expectations about technology. Successful workforce adoption requires more than translating an instruction manual.
        - generic [ref=f2e124]:
          - img "Hotel employees discuss a cleaning robot and training diagrams with an instructor." [ref=f2e126]
          - generic [ref=f2e127]:
            - paragraph [ref=f2e128]: The Robot Age specializes in research-informed multicultural human-robot interaction, workforce education, and adoption practices.
            - paragraph [ref=f2e129]: We investigate how language, workplace culture, communication, trust, and expectations influence how people understand and work alongside robots. We apply these insights to design training programs adapted to diverse workforces.
            - paragraph [ref=f2e130]: English and Spanish are our initial planned training-delivery languages. Other languages are subject to assessment and project scope.
        - generic [ref=f2e131]:
          - article [ref=f2e132]:
            - heading "Multilingual Courses" [level=3] [ref=f2e133]
            - paragraph [ref=f2e134]: Develop robot-specific learning experiences, onboarding materials, and assessments in languages appropriate to each deployment.
          - article [ref=f2e135]:
            - heading "Culturally Adapted Learning" [level=3] [ref=f2e136]
            - paragraph [ref=f2e137]: Adapt instructional examples, terminology, and communication methods to the operational and cultural context.
          - article [ref=f2e138]:
            - heading "Workforce Research" [level=3] [ref=f2e139]
            - paragraph [ref=f2e140]: Use interviews, field observations, and structured evaluations to identify barriers to understanding, trust, and adoption.
          - article [ref=f2e141]:
            - heading "Inclusive Assessment" [level=3] [ref=f2e142]
            - paragraph [ref=f2e143]: Evaluate practical learning outcomes across roles and language groups to identify opportunities for improvement.
        - paragraph [ref=f2e144]: One robotics product. Many languages. Different cultures. A consistent standard of workforce readiness.
    - region [ref=f2e145]:
