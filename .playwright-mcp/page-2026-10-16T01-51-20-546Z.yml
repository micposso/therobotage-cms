    - generic [ref=f6e49]:
      - generic [ref=f6e50]:
        - heading "Robots are arriving faster than the training" [level=2] [ref=f6e51]
        - paragraph [ref=f6e52]: Deployment outcomes depend on people, workflows, environments, and technology. Prepare teams with a shared language before robots arrive.
      - generic [ref=f6e53]:
        - heading "Non-engineering staff carry the risk" [level=2] [ref=f6e54]
        - paragraph [ref=f6e55]: Logistics, facilities, HR, and operations own the environments where robots operate. Without structured literacy, they make decisions in the dark.
      - generic [ref=f6e56]:
        - heading "Readiness is a process, not a checklist" [level=2] [ref=f6e57]
        - paragraph [ref=f6e58]: Our framework gives organizations a repeatable way to assess, train, and verify deployment readiness — before and after go-live.
