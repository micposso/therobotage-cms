    - region [ref=f12e127]:
      - generic [ref=f12e128]:
        - paragraph [ref=f12e129]: OUR SPECIALIZATION
        - generic [ref=f12e130]:
          - heading "Robots operate globally. People experience them differently." [level=2] [ref=f12e131]
          - paragraph [ref=f12e132]: Commercial robots enter workplaces shaped by different languages, cultures, communication styles, and expectations about technology. Successful workforce adoption requires more than translating an instruction manual.
        - generic [ref=f12e133]:
          - img "Hotel employees discuss a cleaning robot and training diagrams with an instructor." [ref=f12e135]
          - generic [ref=f12e136]:
            - paragraph [ref=f12e137]: The Robot Age specializes in research-informed multicultural human-robot interaction, workforce education, and adoption practices.
            - paragraph [ref=f12e138]: We investigate how language, workplace culture, communication, trust, and expectations influence how people understand and work alongside robots. We apply these insights to design training programs adapted to diverse workforces.
            - paragraph [ref=f12e139]: English and Spanish are our initial planned training-delivery languages. Other languages are subject to assessment and project scope.
        - generic [ref=f12e140]:
          - article [ref=f12e141]:
            - heading "Multilingual Courses" [level=3] [ref=f12e142]
            - paragraph [ref=f12e143]: Develop robot-specific learning experiences, onboarding materials, and assessments in languages appropriate to each deployment.
          - article [ref=f12e144]:
            - heading "Culturally Adapted Learning" [level=3] [ref=f12e145]
            - paragraph [ref=f12e146]: Adapt instructional examples, terminology, and communication methods to the operational and cultural context.
          - article [ref=f12e147]:
            - heading "Workforce Research" [level=3] [ref=f12e148]
            - paragraph [ref=f12e149]: Use interviews, field observations, and structured evaluations to identify barriers to understanding, trust, and adoption.
          - article [ref=f12e150]:
            - heading "Inclusive Assessment" [level=3] [ref=f12e151]
            - paragraph [ref=f12e152]: Evaluate practical learning outcomes across roles and language groups to identify opportunities for improvement.
        - paragraph [ref=f12e153]: One robotics product. Many languages. Different cultures. A consistent standard of workforce readiness.
