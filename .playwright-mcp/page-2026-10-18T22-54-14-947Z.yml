    - region [ref=f12e57]:
      - generic [ref=f12e58]:
        - generic [ref=f12e59]:
          - generic [ref=f12e60]:
            - paragraph [ref=f12e61]: THE DEPLOYMENT GAP
            - heading "Installing a robot is only the beginning." [level=2] [ref=f12e62]
          - generic [ref=f12e63]:
            - paragraph [ref=f12e64]: Your team knows how to build, configure, and deploy robots. But every new customer introduces a new workforce, new languages, new workflows, and new operational challenges.
            - paragraph [ref=f12e65]: As deployments scale, customer education becomes a recurring operational responsibility.
        - list [ref=f12e66]:
          - listitem [ref=f12e67]:
            - generic [ref=f12e68]: "01"
            - heading "Training doesn't scale automatically" [level=3] [ref=f12e69]
            - paragraph [ref=f12e70]: Each customer site requires workforce onboarding and practical instruction.
          - listitem [ref=f12e71]:
            - generic [ref=f12e72]: "02"
            - heading "Workforces are not homogeneous" [level=3] [ref=f12e73]
            - paragraph [ref=f12e74]: Employees may have different languages, cultural expectations, job responsibilities, and levels of familiarity with robots.
          - listitem [ref=f12e75]:
            - generic [ref=f12e76]: "03"
            - heading "Adoption continues after go-live" [level=3] [ref=f12e77]
            - paragraph [ref=f12e78]: New hires, changing workflows, software updates, and expanding fleets create continuing education needs.
        - paragraph [ref=f12e79]: You focus on your robots. We help your customers learn how to work with them.
        - paragraph [ref=f12e80]: We prepare workforces. We do not sell or install robots. Our programs complement the manufacturer's technical training, safety engineering, servicing, and commissioning requirements.
