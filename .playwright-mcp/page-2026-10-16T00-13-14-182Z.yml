      - paragraph [ref=f4e39]: THE ROBOT AGE
      - heading "Robot Literacy" [level=1] [ref=f4e40]
      - paragraph [ref=f4e42]: Understand robots. Interact responsibly. Decide how they belong in our world.
      - paragraph [ref=f4e44]: The Robot Age’s Robot Literacy framework helps people understand what robots can do, how humans and robots should interact, and what changes when robots become part of everyday life.
