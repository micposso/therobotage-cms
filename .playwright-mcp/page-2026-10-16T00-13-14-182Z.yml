      - list "Robot Literacy framework areas" [ref=f4e55]:
        - listitem [ref=f4e56]:
          - article [ref=f4e57]:
            - heading "INTERPRET" [level=2] [ref=f4e58]
            - paragraph [ref=f4e59]: Understand the robot
            - paragraph [ref=f4e61]: What can it do? What can it sense? How autonomous is it? What data does it collect or transmit? Where are its limits?
            - paragraph [ref=f4e62]: Capabilities · Sensing · Autonomy · Data · Limitations
        - listitem [ref=f4e63]:
          - article [ref=f4e64]:
            - heading "RELATE" [level=2] [ref=f4e65]
            - paragraph [ref=f4e66]: Interact with robots
            - paragraph [ref=f4e68]: How should robots behave around people? How should people behave around robots? What creates trust, healthy boundaries, clear communication and responsible interaction?
            - paragraph [ref=f4e69]: Trust · Communication · Boundaries · Human control · Responsibility
        - listitem [ref=f4e70]:
          - article [ref=f4e71]:
            - heading "COEXIST" [level=2] [ref=f4e72]
            - paragraph [ref=f4e73]: Live with robots
            - paragraph [ref=f4e75]: What happens when robots become part of workplaces, schools, homes and public spaces? Who benefits, who is affected and who remains responsible?
            - paragraph [ref=f4e76]: Privacy · Work · Accessibility · Governance · Accountability · Society
