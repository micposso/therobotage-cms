    - generic [ref=f4e196]:
      - paragraph [ref=f4e197]: The next literacy
      - heading "Robot Literacy will evolve as robots evolve." [level=2] [ref=f4e198]
      - paragraph [ref=f4e199]: Capabilities, regulations, social norms and human relationships with robots will continue changing. The Robot Age is developing Robot Literacy as a shared framework that can be tested, questioned and refined through education, research and real-world interaction.
