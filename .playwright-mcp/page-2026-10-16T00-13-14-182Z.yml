    - generic [ref=f4e119]:
      - paragraph [ref=f4e120]: Application
      - heading "What does Robot Literacy mean for you?" [level=2] [ref=f4e121]
      - paragraph [ref=f4e122]: The same framework can help people understand robots in very different environments.
      - generic [ref=f4e123]:
        - article [ref=f4e124]:
          - generic [ref=f4e125]:
            - paragraph [ref=f4e126]: For Schools
            - heading "Prepare students to understand robots, not simply use them." [level=3] [ref=f4e127]
          - generic [ref=f4e128]:
            - paragraph [ref=f4e129]: "The Robot Age’s Robot Literacy framework gives educators and students a shared language for discussing robots beyond coding or robotics engineering: capabilities, sensing, privacy, appropriate interaction, human responsibility and the role robots may play in society."
            - paragraph [ref=f4e130]: Example questions
            - list [ref=f4e131]:
              - listitem [ref=f4e132]: What does this robot actually understand?
              - listitem [ref=f4e133]: What information can it collect?
              - listitem [ref=f4e134]: How should children interact with it?
              - listitem [ref=f4e135]: When should a teacher or other human remain in control?
            - link "Experience the Live Robot Lab" [ref=f4e137] [cursor=pointer]:
              - /url: /live-robot-lab
        - article [ref=f4e138]:
          - generic [ref=f4e139]:
            - paragraph [ref=f4e140]: For Organizations
            - heading "Make better decisions about when, where and how robots should be deployed." [level=3] [ref=f4e141]
          - generic [ref=f4e142]:
            - paragraph [ref=f4e143]: The Robot Age’s Robot Literacy framework helps leaders, workers, designers and technology teams examine capabilities, human interaction, workflow changes, privacy, accessibility, risk and accountability before treating robotics as simply a technology purchase or engineering concern.
            - paragraph [ref=f4e144]: Example questions
            - list [ref=f4e145]:
              - listitem [ref=f4e146]: Should a robot perform this task?
              - listitem [ref=f4e147]: How will employees or customers interact with it?
              - listitem [ref=f4e148]: What happens when it fails?
              - listitem [ref=f4e149]: Who remains responsible?
            - link "Explore Robot Literacy Consulting" [ref=f4e151] [cursor=pointer]:
              - /url: /enterprise
        - article [ref=f4e152]:
          - generic [ref=f4e153]:
            - paragraph [ref=f4e154]: For Individuals & Society
            - heading "Build the knowledge needed to live and work alongside robots." [level=3] [ref=f4e155]
          - generic [ref=f4e156]:
            - paragraph [ref=f4e157]: The Robot Age’s Robot Literacy framework gives professionals, students and the public a way to examine robots entering workplaces, public spaces and everyday life without needing to code or build robots, while understanding questions involving privacy, employment, accessibility, governance and human responsibility.
            - paragraph [ref=f4e158]: Example questions
            - list [ref=f4e159]:
              - listitem [ref=f4e160]: What should I know when I encounter a robot?
              - listitem [ref=f4e161]: What can it perceive about me?
              - listitem [ref=f4e162]: How could robots change my profession?
              - listitem [ref=f4e163]: What rules and expectations should society develop?
            - link "Explore Professional Programs" [ref=f4e165] [cursor=pointer]:
              - /url: /learn#programs
