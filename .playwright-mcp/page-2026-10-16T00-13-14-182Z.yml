              - /url: /live-robot-lab
        - article [ref=f4e185]:
          - heading "Corporate Consulting & Workshops" [level=3] [ref=f4e187]
          - generic [ref=f4e188]:
            - paragraph [ref=f4e189]: Programs for companies, universities and organizations applying Robot Literacy to workforce readiness, robot deployment, customer experience, governance and responsible adoption.
            - link "Discuss a Program" [ref=f4e191] [cursor=pointer]:
              - /url: /enterprise
      - paragraph [ref=f4e192]: The Robot Age’s Robot Literacy framework is hardware-agnostic and can be applied across humanoids, quadrupeds, social robots, autonomous mobile robots, cobots and emerging robotic systems.
