# Company registry for the job board.
#
# Every job markdown file references a key from this file in its `company:` field. The
# publish script upserts these into the companies table before any job is written, so a
# typo here surfaces as a validation error rather than a broken foreign key.
#
# Keys are lowercase-hyphenated and become the company slug.
#
# size_bucket must be one of: 1-10, 11-50, 51-200, 201-500, 501-1000, 1000+
# hq_state must be a 2-letter US code (or omitted for companies headquartered abroad).
#
# Real employers
# ─────────────────────────────────────────────────────────────────────────────

